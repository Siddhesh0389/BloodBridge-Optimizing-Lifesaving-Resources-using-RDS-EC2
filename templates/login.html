{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
            <div class="card-header text-center">
                <h3 class="mb-0">
                    <i class="fas fa-sign-in-alt"></i> Login to BloodBridge
                </h3>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" class="form-control" id="username" name="username" required 
                               placeholder="Enter your username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password" required 
                               placeholder="Enter your password">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-2">Demo Accounts:</p>
                    <div class="row g-2">
                        <div class="col">
                            <button class="btn btn-sm btn-outline-danger w-100" onclick="fillDemo('admin', 'Admin@123')">
                                Bank Manager
                            </button>
                        </div>
                        <div class="col">
                            <button class="btn btn-sm btn-outline-warning w-100" onclick="fillDemo('cityhospital', 'Hospital@123')">
                                Hospital Admin
                            </button>
                        </div>
                        <div class="col">
                            <button class="btn btn-sm btn-outline-success w-100" onclick="fillDemo('johndoe', 'Donor@123')">
                                Blood Donor
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-3">
                    <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(username, password) {
    document.getElementById('username').value = username;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
